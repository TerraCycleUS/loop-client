version: 2.1

executors:
  node:
    docker:
      - image: cimg/node:22.23.2
        environment:
          JIRA_PROJECT: ITG
          JIRA_BROWSE_URL: https://terracycle.atlassian.net/browse

commands:
  install_release_tooling:
    steps:
      - restore_cache:
          keys:
            - loop-client-npm-{{ checksum ".release/package-lock.json" }}
      - run:
          name: Install pinned release tooling
          command: npm ci --prefix .release
      - save_cache:
          key: loop-client-npm-{{ checksum ".release/package-lock.json" }}
          paths:
            - ~/.npm

jobs:
  secret-scan:
    docker:
      - image: cimg/base:current
    environment:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - checkout
      - run:
          name: Install gitleaks
          command: |
            curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
              | sudo tar -xz -C /usr/local/bin gitleaks
            gitleaks version
      - run:
          name: Scan for secrets
          command: |
            git fetch --quiet origin master
            BASE=$(git merge-base FETCH_HEAD HEAD)
            if [ "$BASE" = "$(git rev-parse HEAD)" ]; then
              gitleaks git --redact --verbose --log-opts="-n 50"
            else
              gitleaks git --redact --verbose --log-opts="$BASE..HEAD"
            fi
          no_output_timeout: 20m

  build:
    docker:
      - image: cimg/ruby:4.0.6
    steps:
      - checkout
      - restore_cache:
          keys:
            - loop-client-bundle-{{ checksum "Gemfile.lock" }}
      - run:
          name: Install dependencies
          command: bundle config set --local path vendor/bundle && bundle install --jobs 4
      - save_cache:
          key: loop-client-bundle-{{ checksum "Gemfile.lock" }}
          paths:
            - vendor/bundle
      - run:
          name: Run the default task
          command: bundle exec rake

  release_rules:
    executor: node
    steps:
      - checkout
      - install_release_tooling
      - run:
          name: Verify release rules
          command: .release/node_modules/.bin/verify-release-rules

  pr_rules:
    executor: node
    steps:
      - checkout
      - install_release_tooling
      - run:
          name: Verify branch and pull request title rules
          command: .release/node_modules/.bin/validate-pull-request

  # RELEASE_PLEASE_TOKEN comes from the tc-loop-release-please context, shared by the TC
  # and Loop repositories. Only this job may carry it: it is the one job restricted to
  # master. Every other job runs on branch code, and this repository is public, so a
  # token reachable from them would be a token any contributor could exfiltrate.
  release_please:
    executor: node
    steps:
      - checkout
      - install_release_tooling
      - run:
          name: Publish a merged release pull request and prepare the next release
          command: |
            set -euo pipefail

            RELEASE_PLEASE=".release/node_modules/.bin/release-please"

            ARGS=(
              --token="$RELEASE_PLEASE_TOKEN"
              --repo-url="${CIRCLE_PROJECT_USERNAME}/${CIRCLE_PROJECT_REPONAME}"
              --target-branch="master"
              --config-file="release-please-config.json"
              --manifest-file=".release-please-manifest.json"
            )

            "$RELEASE_PLEASE" github-release "${ARGS[@]}"
            "$RELEASE_PLEASE" release-pr "${ARGS[@]}"
      - run:
          name: Branch the published release so Heroku can deploy it
          command: .release/node_modules/.bin/create-release-branch
      - run:
          name: Resolve Jira keys in the published release notes
          command: .release/node_modules/.bin/linkify-release-notes
      - run:
          name: Resolve Jira keys in the release pull request changelog
          command: .release/node_modules/.bin/linkify-changelog

workflows:
  build-test-release:
    jobs:
      - build
      - secret-scan
      - release_rules
      - pr_rules
      - release_please:
          context: tc-loop-release-please
          requires:
            - build
            - secret-scan
            - release_rules
            - pr_rules
          serial-group: << pipeline.project.slug >>/release-please
          filters:
            branches:
              only:
                - master
