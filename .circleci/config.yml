version: 2.1

commands:
  install_release_tooling:
    steps:
      - restore_cache:
          keys:
            - loop-client-npm-{{ checksum ".release/package-lock.json" }}
      - run:
          name: Install pinned release tooling
          command: npm ci --prefix .release
      - save_cache:
          key: loop-client-npm-{{ checksum ".release/package-lock.json" }}
          paths:
            - ~/.npm

jobs:
  secret-scan:
    docker:
      - image: cimg/base:current
    environment:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - checkout
      - run:
          name: Install gitleaks
          command: |
            curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
              | sudo tar -xz -C /usr/local/bin gitleaks
            gitleaks version
      - run:
          name: Scan for secrets
          command: |
            git fetch --quiet origin master
            BASE=$(git merge-base FETCH_HEAD HEAD)
            if [ "$BASE" = "$(git rev-parse HEAD)" ]; then
              gitleaks git --redact --verbose --log-opts="-n 50"
            else
              gitleaks git --redact --verbose --log-opts="$BASE..HEAD"
            fi
          no_output_timeout: 20m

  build:
    docker:
      - image: cimg/ruby:4.0.6
    steps:
      - checkout
      - restore_cache:
          keys:
            - loop-client-bundle-{{ checksum "Gemfile.lock" }}
      - run:
          name: Install dependencies
          command: bundle config set --local path vendor/bundle && bundle install --jobs 4
      - save_cache:
          key: loop-client-bundle-{{ checksum "Gemfile.lock" }}
          paths:
            - vendor/bundle
      - run:
          name: Run the default task
          command: bundle exec rake

  release_rules:
    docker:
      - image: cimg/node:22.18.0
    steps:
      - checkout
      - install_release_tooling
      - run:
          name: Verify release rules
          command: |
            node .release/verify-release-please-rules.mjs
            node .release/linkify-release-notes.mjs --self-test

  pr_rules:
    docker:
      - image: cimg/node:22.18.0
    steps:
      - checkout
      - run:
          name: Verify branch and pull request title rules
          command: |
            node .circleci/validate-pull-request.mjs --self-test
            node .circleci/validate-pull-request.mjs

  # RELEASE_PLEASE_TOKEN comes from the loop-client-release-please context, fine-grained
  # to this repository: metadata read, contents/pull requests/issues read and write.
  # Keep it in the context, never as a project-level variable — this repository is public
  # and project-level variables reach every job, including those on pull request branches.
  release_please:
    docker:
      - image: cimg/node:22.18.0
    steps:
      - checkout
      - install_release_tooling
      - run:
          name: Publish a merged release pull request and prepare the next release
          command: |
            set -euo pipefail

            RELEASE_PLEASE=".release/node_modules/.bin/release-please"

            ARGS=(
              --token="$RELEASE_PLEASE_TOKEN"
              --repo-url="${CIRCLE_PROJECT_USERNAME}/${CIRCLE_PROJECT_REPONAME}"
              --target-branch="master"
              --config-file="release-please-config.json"
              --manifest-file=".release-please-manifest.json"
            )

            "$RELEASE_PLEASE" github-release "${ARGS[@]}"
            "$RELEASE_PLEASE" release-pr "${ARGS[@]}"
      - run:
          name: Branch the published release so Heroku can deploy it
          command: node .release/create-release-branch.mjs
      - run:
          name: Resolve Jira keys in the published release notes
          command: node .release/linkify-release-notes.mjs

workflows:
  build-test-release:
    jobs:
      - build
      - secret-scan
      - release_rules
      - pr_rules
      - release_please:
          context: loop-client-release-please
          requires:
            - build
            - secret-scan
            - release_rules
            - pr_rules
          serial-group: << pipeline.project.slug >>/release-please
          filters:
            branches:
              only:
                - master
