version: 2.1

commands:
  install_release_tooling:
    steps:
      - restore_cache:
          keys:
            - loop-client-npm-{{ checksum ".release/package-lock.json" }}
      - run:
          name: Install pinned release tooling
          command: npm ci --prefix .release
      - save_cache:
          key: loop-client-npm-{{ checksum ".release/package-lock.json" }}
          paths:
            - ~/.npm

jobs:
  build:
    docker:
      - image: ruby:3.4.8
    steps:
      - checkout
      - run:
          name: Run the default task
          command: |
            gem install bundler
            bundle install
            bundle exec rake

  release_rules:
    docker:
      - image: cimg/node:22.18.0
    steps:
      - checkout
      - install_release_tooling
      - run:
          name: Verify release rules
          command: node .release/verify-release-please-rules.mjs

  pr_rules:
    docker:
      - image: cimg/node:22.18.0
    steps:
      - checkout
      - run:
          name: Verify branch and pull request title rules
          command: |
            node .circleci/validate-pull-request.mjs --self-test
            node .circleci/validate-pull-request.mjs

  # RELEASE_PLEASE_TOKEN comes from the loop-client-release-please context, fine-grained
  # to this repository: metadata read, contents/pull requests/issues read and write.
  # Keep it in the context, never as a project-level variable — this repository is public
  # and project-level variables reach every job, including those on pull request branches.
  release_please:
    docker:
      - image: cimg/node:22.18.0
    steps:
      - checkout
      - install_release_tooling
      - run:
          name: Publish a merged release pull request and prepare the next release
          command: |
            set -euo pipefail

            RELEASE_PLEASE=".release/node_modules/.bin/release-please"

            ARGS=(
              --token="$RELEASE_PLEASE_TOKEN"
              --repo-url="${CIRCLE_PROJECT_USERNAME}/${CIRCLE_PROJECT_REPONAME}"
              --target-branch="master"
              --config-file="release-please-config.json"
              --manifest-file=".release-please-manifest.json"
            )

            "$RELEASE_PLEASE" github-release "${ARGS[@]}"
            "$RELEASE_PLEASE" release-pr "${ARGS[@]}"

workflows:
  build-test-release:
    jobs:
      - build
      - release_rules
      - pr_rules
      - release_please:
          context: loop-client-release-please
          requires:
            - build
            - release_rules
            - pr_rules
          serial-group: << pipeline.project.slug >>/release-please
          filters:
            branches:
              only:
                - master
